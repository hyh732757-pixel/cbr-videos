name: save-test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - name: 저장 시험
        run: |
          set -x
          echo hello > /tmp/x.txt
          git config --global user.name "github-actions"; git config --global user.email "actions@users.noreply.github.com"
          git clone -q --depth 1 --branch results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/rb 2>/tmp/err || { git init -q /tmp/rb && git -C /tmp/rb checkout -q -b results && git -C /tmp/rb remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; }
          mkdir -p /tmp/rb/test && cp /tmp/x.txt /tmp/rb/test/ && cd /tmp/rb && git add -A && git commit -q --allow-empty -m test 2>&1 | tee -a /tmp/err
          git push origin results >>/tmp/err 2>&1 || true
          echo "::notice title=저장 결과::$(tr '\n' '|' < /tmp/err | cut -c1-900)"
