name: process-match
run-name: "경기 처리 ${{ inputs.mid }}"
on:
  workflow_dispatch:
    inputs:
      video_url: {description: "영상 링크", required: true}
      mid: {description: "경기 ID (예: m10)", required: true}
      lineup: {description: "라인업 JSON(선택, 비우면 로비 화면에서 자동 인식)", required: false, default: ""}
      pipeline_tag: {description: "처리 묶음 브랜치", required: false, default: "pipeline-v1"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: 프로그램 설치
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y tesseract-ocr ffmpeg >/dev/null
          pip -q install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
          pip -q install numpy==2.4.6 scikit-learn==1.9.1 scipy==1.18.1 opencv-python-headless==5.0.0.93 ultralytics==8.4.173 openvino==2026.4.1 rapidfuzz==3.14.6 pytesseract==0.3.13 pillow==12.3.0
          tesseract --version | head -1; ffmpeg -version | head -1; nproc; free -g | head -2
      - name: 처리 묶음 받기
        uses: actions/checkout@v4
        with: {ref: "${{ inputs.pipeline_tag }}", path: pkgsrc, lfs: false}
      - name: 처리 묶음 풀기
        run: |
          cat pkgsrc/pkg/cbr_pipeline.tgz.part* > /tmp/cbr_pipeline.tgz
          test "$(md5sum /tmp/cbr_pipeline.tgz | cut -c1-32)" = "$(cat pkgsrc/pkg/md5.txt)" || { echo "묶음 파일 손상"; exit 1; }
          sudo mkdir -p /home/claude && sudo chown "$USER" /home/claude && tar xzf /tmp/cbr_pipeline.tgz -C /home/claude && rm -rf pkgsrc
      - uses: actions/checkout@v4
        with: {path: mainsrc, sparse-checkout: overlay}
      - name: 작은 수정 덮어쓰기(overlay)
        run: cp -r mainsrc/overlay/. /home/claude/ && rm -rf mainsrc
      - name: 경기 처리
        env: {URL: "${{ inputs.video_url }}", MID: "${{ inputs.mid }}", LINEUP: "${{ inputs.lineup }}"}
        run: bash /home/claude/pipe/gha_run.sh "$URL" "$MID" "$LINEUP"
      - name: 요약 남기기(로그 대신)
        if: always()
        run: |
          echo "::notice title=파일::$(ls out 2>/dev/null | tr '\n' ' ')"
          [ -f out/timeline.txt ] && echo "::notice title=단계별 시간::$(tr '\n' '|' < out/timeline.txt)"
          [ -f out/run_video.log ] && echo "::notice title=처리 로그 끝::$(grep -a '누적' out/run_video.log | tail -25 | cut -c1-160 | tr '\n' '|')"
          [ -f out/run_video.log ] && echo "::notice title=오류::$(grep -a -i -E 'error|Traceback' out/run_video.log | tail -8 | cut -c1-200 | tr '\n' '|')"
          for f in out/audit_*.log; do [ -f "$f" ] && echo "::notice title=$f::$(grep -a -E '===|⚠|🔎|Traceback|Error' "$f" | head -12 | cut -c1-200 | tr '\n' '|')"; done
          true
      - name: 결과를 results 브랜치에 저장
        if: always()
        env: {MID: "${{ inputs.mid }}", RID: "${{ github.run_id }}"}
        run: |
          D="results/${MID}_${RID}"; mkdir -p "/tmp/res/$D"
          cp out/*.json out/*.txt out/*.log "/tmp/res/$D/" 2>/dev/null || true
          git config --global user.name "github-actions"; git config --global user.email "actions@users.noreply.github.com"
          git clone -q --depth 1 --branch results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" /tmp/rb 2>/dev/null || { git init -q /tmp/rb && git -C /tmp/rb checkout -q -b results && git -C /tmp/rb remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; }
          mkdir -p "/tmp/rb/$D" && cp -r "/tmp/res/$D/." "/tmp/rb/$D/"
          cd /tmp/rb && git add -A && git commit -q --allow-empty -m "결과 ${MID} (run ${RID})" && for i in 1 2 3; do git pull -q --rebase origin results 2>/dev/null || true; git push -q origin results && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "result-${{ inputs.mid }}", path: out/, retention-days: 30}
